<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Debug Logs</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #4ec9b0;
      border-bottom: 2px solid #4ec9b0;
      padding-bottom: 10px;
    }
    .controls {
      margin: 20px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background: #005a9e;
    }
    .log-container {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 16px;
      max-height: 600px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .log-entry {
      margin-bottom: 12px;
      padding: 8px;
      border-left: 3px solid #888;
      background: #1e1e1e;
    }
    .log-entry.info {
      border-left-color: #4ec9b0;
    }
    .log-entry.warning {
      border-left-color: #dcdcaa;
    }
    .log-entry.error {
      border-left-color: #f48771;
    }
    .log-entry.success {
      border-left-color: #6a9955;
    }
    .timestamp {
      color: #858585;
      font-size: 0.9em;
    }
    .level {
      font-weight: bold;
      margin-right: 8px;
    }
    .info .level { color: #4ec9b0; }
    .warning .level { color: #dcdcaa; }
    .error .level { color: #f48771; }
    .success .level { color: #6a9955; }
    .message {
      color: #d4d4d4;
      margin-top: 4px;
    }
    .stats {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #4ec9b0;
    }
    .stat-label {
      font-size: 12px;
      color: #858585;
      margin-top: 4px;
    }
    .empty {
      color: #858585;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Auth Debug Logs</h1>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="total-count">0</div>
        <div class="stat-label">Total Entries</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="error-count">0</div>
        <div class="stat-label">Errors</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="warning-count">0</div>
        <div class="stat-label">Warnings</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="last-update">—</div>
        <div class="stat-label">Last Update</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="refreshLogs()">🔄 Refresh Logs</button>
      <button onclick="clearLogs()">🗑️ Clear All Logs</button>
      <button onclick="downloadLogs()">💾 Download Logs</button>
      <button onclick="window.location.href='login.html'">📝 Go to Login</button>
      <button onclick="window.location.href='index.html'">🏠 Go to App</button>
    </div>

    <div class="log-container" id="log-container">
      <div class="empty">No logs yet. Navigate to login.html or index.html to generate logs.</div>
    </div>
  </div>

  <script>
    function getLogs() {
      const raw = localStorage.getItem('auth_debug_logs') || '[]';
      try {
        return JSON.parse(raw);
      } catch (e) {
        return [];
      }
    }

    function displayLogs() {
      const logs = getLogs();
      const container = document.getElementById('log-container');

      if (logs.length === 0) {
        container.innerHTML = '<div class="empty">No logs yet. Navigate to login.html or index.html to generate logs.</div>';
        document.getElementById('total-count').textContent = '0';
        document.getElementById('error-count').textContent = '0';
        document.getElementById('warning-count').textContent = '0';
        document.getElementById('last-update').textContent = '—';
        return;
      }

      let errorCount = 0, warningCount = 0;
      const html = logs.map(log => {
        const levelClass = log.level.toLowerCase();
        if (log.level === 'ERROR') errorCount++;
        if (log.level === 'WARNING') warningCount++;

        return `
          <div class="log-entry ${levelClass}">
            <div>
              <span class="timestamp">[${log.timestamp}]</span>
              <span class="level">${log.level}</span>
            </div>
            <div class="message">${escapeHtml(log.message)}</div>
            ${log.data ? `<div class="message" style="color: #858585; font-size: 0.9em; margin-top: 4px;">${escapeHtml(JSON.stringify(log.data))}</div>` : ''}
          </div>
        `;
      }).join('');

      container.innerHTML = html;
      document.getElementById('total-count').textContent = logs.length;
      document.getElementById('error-count').textContent = errorCount;
      document.getElementById('warning-count').textContent = warningCount;
      
      const lastLog = logs[logs.length - 1];
      document.getElementById('last-update').textContent = lastLog.timestamp;

      // Auto-scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    function refreshLogs() {
      displayLogs();
    }

    function clearLogs() {
      if (confirm('Are you sure? This will delete all logged events.')) {
        localStorage.removeItem('auth_debug_logs');
        displayLogs();
      }
    }

    function downloadLogs() {
      const logs = getLogs();
      const text = logs.map(log => 
        `[${log.timestamp}] ${log.level}: ${log.message}${log.data ? '\n  ' + JSON.stringify(log.data) : ''}`
      ).join('\n');
      
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `auth-logs-${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Auto-refresh every 2 seconds
    setInterval(displayLogs, 2000);
    displayLogs();
  </script>
</body>
</html>
